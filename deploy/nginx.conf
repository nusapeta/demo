server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    gzip on;
    gzip_types text/css application/javascript image/svg+xml text/plain;

    # Resolve the gateway per request: a missing or restarted upstream must not
    # keep this container from starting, and a recreated gateway changes IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api routeid-gateway:8080;

    # Liveness of this container only. The gateway keeps its own healthcheck:
    # proxying it here would turn an upstream outage into a restart loop that
    # cannot fix anything.
    location = /healthz {
        access_log off;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        return 200 "ok\n";
    }

    # API surface. The gateway picks the profile from ?profile=, mounts the
    # geocoder at /place, and rate limits per client, so the Cloudflare client
    # IP has to survive this hop.
    location /route {
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://$api;
    }

    location /place {
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://$api;
    }

    location /assets/ {
        include /etc/nginx/snippets/headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = / {
        include /etc/nginx/snippets/headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }

    location / {
        include /etc/nginx/snippets/headers.conf;
        return 404;
    }
}
