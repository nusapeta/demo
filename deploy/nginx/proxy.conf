# The gateway runs with -trust-proxy, and its limiter keys on the forwarded
# client, not on this container. Dropping CF-Connecting-IP would collapse every
# visitor into one rate-limit bucket.
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
proxy_set_header Connection "";
proxy_connect_timeout 5s;
proxy_send_timeout 30s;
# The gateway's own upstream deadline is 10s; this only has to outlast it.
proxy_read_timeout 30s;
