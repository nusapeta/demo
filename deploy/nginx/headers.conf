# Same policy the gateway sent for the embedded page: the map needs OSM tiles
# and nothing else, and the page may not be framed or navigate away.
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; img-src 'self' data: https://tile.openstreetmap.org; style-src 'self'; script-src 'self'; connect-src 'self'; font-src 'self'; object-src 'none'" always;
